name: Install resume tools
description: pdfLaTeX and Pandoc, which scripts/resume/build.mjs needs to build the resume PDF and HTML.

inputs:
  pandoc-version:
    description: Pandoc release to install.
    default: "3.14"

runs:
  using: composite
  steps:
    # pdfLaTeX is what Overleaf compiles the resume with. latex-extra and
    # cm-super cover what it uses today (fullpage, scalable T1 fonts) and the
    # packages a resume usually picks up next.
    - name: Install pdfLaTeX
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends \
          texlive-latex-base texlive-latex-recommended texlive-latex-extra \
          texlive-fonts-recommended cm-super
    # Pinned: the HTML depends on how this Pandoc version parses the LaTeX.
    - name: Install Pandoc
      shell: bash
      env:
        PANDOC_VERSION: ${{ inputs.pandoc-version }}
      run: |
        curl -fsSL -o "$RUNNER_TEMP/pandoc.deb" \
          "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
        sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"
